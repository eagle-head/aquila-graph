groups:
  - name: aquila-observability
    rules:
      - alert: TelemetryServiceUnavailable
        expr: up == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Telemetry service cannot be scraped'}
      - alert: TelemetryQueuePressure
        expr: otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Collector persistent queue exceeds 80 percent capacity'}
      - alert: TelemetryRejected
        expr: 'sum(increase({__name__=~"otelcol_exporter_enqueue_failed_(spans|log_records|metric_points)"}[5m])) > 0'
        labels: {severity: warning}
        annotations: {summary: 'Collector could not enqueue telemetry; inspect exporter diagnostics'}
      - alert: AnalysisFailure
        expr: 'sum(increase(aquila_analysis_completed_total{aquila_outcome=~"FAILED|ABORTED"}[5m])) > 0 or sum(aquila_analysis_completed_total{aquila_outcome=~"FAILED|ABORTED"} unless aquila_analysis_completed_total{aquila_outcome=~"FAILED|ABORTED"} offset 5m) > 0'
        labels: {severity: warning}
        annotations: {summary: 'An analysis failed or was aborted'}
      - alert: SdkTelemetryDropped
        expr: 'sum(increase({__name__=~"processedSpans_total|processedLogs_total",dropped="true"}[5m])) > 0 or sum({__name__=~"processedSpans_total|processedLogs_total",dropped="true"} unless {__name__=~"processedSpans_total|processedLogs_total",dropped="true"} offset 5m) > 0'
        labels: {severity: warning}
        annotations: {summary: 'The Java SDK dropped telemetry because its bounded queue was full'}
      - alert: AnalysisObservationInterrupted
        expr: '(aquila_execution_state == 0) and on (aquila_execution_id, instance) (time() - aquila_execution_heartbeat_seconds > 20)'
        for: 10s
        labels: {severity: warning}
        annotations: {summary: 'An unfinished analysis has stopped reporting; its final result is unknown'}
      - alert: AnalysisCancelled
        expr: '(aquila_execution_state == 4) and on (aquila_execution_id, instance) (time() - aquila_execution_heartbeat_seconds < 300)'
        labels: {severity: info}
        annotations: {summary: 'An analysis acknowledged cancellation and closed its observations'}
