# yaml-language-server: $schema=../../config/schemas/prometheus.schema.json
global:
  scrape_interval: 10s
  evaluation_interval: 10s
storage:
  tsdb:
    out_of_order_time_window: 30m
otlp:
  promote_resource_attributes: [service.name, service.version]
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ['collector:8888']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: jaeger
    static_configs:
      - targets: ['jaeger:8888']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
