apiVersion: 1
deleteDatasources:
  - name: Jaeger
    orgId: 1
datasources:
  - name: Prometheus
    uid: aquila-metrics
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          url: http://127.0.0.1:16686/trace/$${__value.raw}
  - name: Loki
    uid: aquila-logs
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: 'http://127.0.0.1:16686/trace/$${__value.raw}'
