extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 8388608

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    timeout: 5s
    retry_on_failure: {initial_interval: 1s, max_interval: 10s, max_elapsed_time: 5m}
    sending_queue: {storage: file_storage, queue_size: 1000, num_consumers: 2}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    retry_on_failure: {initial_interval: 1s, max_interval: 10s, max_elapsed_time: 5m}
    sending_queue: {storage: file_storage, queue_size: 1000, num_consumers: 2}
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
    timeout: 5s
    retry_on_failure: {initial_interval: 1s, max_interval: 10s, max_elapsed_time: 5m}
    sending_queue: {storage: file_storage, queue_size: 1000, num_consumers: 2}

service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs: {level: info, encoding: json}
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
