services:
  neo4j:
    image: neo4j:2026.08.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deployment/neo4j/.env}"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          password="$${NEO4J_AUTH#*/}";
          cypher-shell -a neo4j://localhost:7687 -u neo4j -p "$$password"
          "RETURN 1" >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  neo4j-data:
    name: aquila-graph-neo4j-data
